apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default-ec2
spec:
  amiFamily: AL2023
  role: "<karpenter_node_role_name>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<cluster_name>"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<cluster_name>"
  tags:
    karpenter.sh/discovery: "<cluster_name>"
